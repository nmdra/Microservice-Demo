services:
  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_DB: userservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d userservice"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    ports:
      - "5432:5432"
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3
      timeout: 3s

  auth-service:
    build: ./auth-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/userservice
    ports:
      - "3000:3000"
    networks:
      - app-network

  user-service:
    build: ./user-service
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/userservice
    ports:
      - "3001:3000"
    networks:
      - app-network

  microservice1:
    build: ./microservice-1 
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
    ports:
      - "4000:3001"
    networks:
      - app-network

  microservice2:
    build: ./microservice-2 
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
    ports:
      - "5000:3002"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
