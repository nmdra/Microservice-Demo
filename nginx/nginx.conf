events {}

http {
    # Rate Limiting (5 requests per second per IP)
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

    upstream auth_service {
        server auth-service:3000;
    }
    
    upstream user_service {
        server user-service:3000;
    }
    
    upstream microservice1 {
        server microservice1:3001;
    }

    upstream microservice2 {
        server microservice2:3002;
    }

    server {
        listen 80;
        server_name yourdomain.com;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none';";
        add_header Referrer-Policy "no-referrer-when-downgrade";

        # Limit Buffer Size
        client_body_buffer_size 10K;
        client_max_body_size 1M;

        # Prevent Slowloris Attacks
        client_body_timeout 10;
        client_header_timeout 10;
        keepalive_timeout 15;
        send_timeout 10;

        # Restrict Bad User Agents
        if ($http_user_agent ~* (nmap|sqlmap|curl|wget)) {
            return 403;
        }

        # Public Route (Login)
        location /auth/ {
            proxy_pass http://auth_service/;
            limit_req zone=api burst=10;
        }

        # User Service
        location /user/ {
            proxy_pass http://user_service/;
            limit_req zone=api burst=10;
        }

        # Protected Routes
        location /service1/ {
            auth_request /validate_token;
            error_page 401 = /unauthorized;
            proxy_pass http://microservice1/;
        }

        location /service2/ {
            auth_request /validate_token;
            error_page 401 = /unauthorized;
            proxy_pass http://microservice2/;
        }

        # Token Validation (Internal)
        location = /validate_token {
            internal;
            proxy_pass http://auth_service/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        location = /unauthorized {
            return 401;
        }
    }
}
